[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tino-userapi"
version = "1.0.0"
description = "Official Python SDK for the Tino UserAPI (https://api.tino.vn)"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Tino Group", email = "support@tino.vn" }]
keywords = ["tino", "tinohost", "hosting", "domain", "vps", "hostbill", "sdk", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tinovn/tino-sdk"
Documentation = "https://github.com/tinovn/tino-sdk/tree/main/docs"
Issues = "https://github.com/tinovn/tino-sdk/issues"

[tool.setuptools.packages.find]
include = ["tino_userapi*"]
